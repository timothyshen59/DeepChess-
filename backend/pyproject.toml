[project]
name = "chess-backend"
version = "0.1.0"
description = "Chess analysis API — move annotation + Elo prediction"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "chess>=1.10.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "langgraph>=1.2.10",
    "anthropic>=0.120.2",
    "python-chess>=1.999",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "httpx>=0.27.0",     # Lichess Opening Explorer client (services/opening_deviation)
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",  # for testing the opening agent's async graph/route
    "ruff>=0.4.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["(^|/)tests/"]

[[tool.mypy.overrides]]
# onnxruntime is the one production dependency without a py.typed marker or
# published stubs (verified directly, not assumed -- every other dependency
# here -- chess, fastapi, pydantic, httpx, numpy, uvicorn, langgraph,
# anthropic -- ships its own py.typed). Scoped to just this module rather
# than a blanket ignore_missing_imports.
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-m", "not e2e and not integration"]
markers = [
    "e2e: full end-to-end tests using a real Stockfish engine and real graphs; requires a local `stockfish` binary. Run with `pytest -m e2e`; excluded by default via `addopts` below (pass `-m e2e` explicitly to run them).",
    "integration: exercises real infrastructure (a real Stockfish binary) but no external network services; requires a local `stockfish` binary. Run with `pytest -m integration`; excluded by default via `addopts` below.",
]
